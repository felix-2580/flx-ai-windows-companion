name: Build FLX.AI Windows Companion
on:
  workflow_dispatch:
  push:
    paths:
      - 'companion.py'
      - 'companion-requirements.txt'
      - '.github/workflows/build-windows-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r companion-requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --name FLXAI-Companion --collect-all pycaw --collect-all comtypes companion.py
      - uses: actions/upload-artifact@v4
        with:
          name: FLXAI-Companion-Windows
          path: dist/FLXAI-Companion.exe
